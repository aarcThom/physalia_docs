{% extends "base.html" %}

<!--
  Splash page. Fills base.html's `hero` block, which sits below the pinned
  header and tabs, so this area scrolls while they stay put.

  Deliberately empty — a flat panel waiting for the dot-particle animation.
-->

{% block hero %}
  <div class="phy-hero"></div>
{% endblock %}

<!-- A splash page carries no article of its own; `container` is the block
     that wraps the whole content well, so dropping it leaves no empty box. -->
{% block container %}{% endblock %}
